	<main>
		<h1>Task 1 — Form with HTML5 Validation</h1>
		<p>The browser checks the fields and shows its own messages.</p>
		<form class="simple-form" action="#" method="post">
			<label for="name">Name (required, 2–50 characters)</label>
			<input type="text" id="name" name="name" required minlength="2" maxlength="50" autocomplete="name">

			<label for="email">Email (required)</label>
			<input type="email" id="email" name="email" required maxlength="100" autocomplete="email">

			<label for="phone">Phone (optional, digits, + and spaces)</label>
			<input type="tel" id="phone" name="phone" pattern="[0-9+ ]{7,15}" title="7 to 15 digits, + or spaces" autocomplete="tel">

			<label for="message">Message (required, 10–500 characters)</label>
			<textarea id="message" name="message" rows="5" required minlength="10" maxlength="500"></textarea>

			<button type="submit">Submit</button>
		</form>
	</main>
</body>
</html>
