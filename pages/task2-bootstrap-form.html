<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Task 2 — Bootstrap Form Styling</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="../css/style.css">
</head>
<body>
	<nav class="site-nav">
		<a href="../index.html">Home</a>
		<a href="task0-contact.html">Task 0</a>
		<a href="task1-html-validation.html">Task 1</a>
		<a href="task2-bootstrap-form.html" aria-current="page">Task 2</a>
		<a href="task3-bootstrap-validation.html">Task 3</a>
		<a href="task4-registration.html">Task 4</a>
	</nav>
	<main>
		<h1 class="mb-4">Task 2 — Bootstrap Form Styling</h1>
		<form class="row g-3" action="#" method="post">
			<div class="col-md-6">
				<label for="name" class="form-label">Name</label>
				<input type="text" class="form-control" id="name" name="name" placeholder="Your name" autocomplete="name">
			</div>
			<div class="col-md-6">
				<label for="email" class="form-label">Email</label>
				<input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" aria-describedby="email-help">
				<div id="email-help" class="form-text">We will never share your email.</div>
			</div>
			<div class="col-12">
				<label for="message" class="form-label">Message</label>
				<textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here"></textarea>
			</div>
			<div class="col-12">
				<button type="submit" class="btn btn-primary">Submit</button>
			</div>
		</form>
	</main>
</body>
</html>
