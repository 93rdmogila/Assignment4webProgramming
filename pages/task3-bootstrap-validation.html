<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Task 3 — Bootstrap Validation</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="../css/style.css">
</head>
<body>
	<nav class="site-nav">
		<a href="../index.html">Home</a>
		<a href="task0-contact.html">Task 0</a>
		<a href="task1-html-validation.html">Task 1</a>
		<a href="task2-bootstrap-form.html">Task 2</a>
		<a href="task3-bootstrap-validation.html" aria-current="page">Task 3</a>
		<a href="task4-registration.html">Task 4</a>
	</nav>
	<main>
		<h1 class="mb-4">Task 3 — Bootstrap Validation Styles</h1>
		<form id="contact-form" class="row g-3" action="#" novalidate>
			<div class="col-md-6">
				<label for="name" class="form-label">Name</label>
				<input type="text" class="form-control" id="name" name="name" required minlength="2" autocomplete="name">
				<div class="valid-feedback">Looks good.</div>
				<div class="invalid-feedback">Enter your name (at least 2 characters).</div>
			</div>
			<div class="col-md-6">
				<label for="email" class="form-label">Email</label>
				<input type="email" class="form-control" id="email" name="email" required autocomplete="email">
				<div class="valid-feedback">Looks good.</div>
				<div class="invalid-feedback">Enter a valid email, for example name@example.com.</div>
			</div>
			<div class="col-12">
				<label for="message" class="form-label">Message</label>
				<textarea class="form-control" id="message" name="message" rows="5" required></textarea>
				<div class="valid-feedback">Looks good.</div>
				<div class="invalid-feedback">Enter a message.</div>
			</div>
			<div class="col-12">
				<button type="submit" class="btn btn-primary">Submit</button>
			</div>
		</form>
	</main>
	<script>
		const form = document.getElementById("contact-form");
		const fields = form.querySelectorAll("input, textarea");

		function showState(field) {
			const isValid = field.checkValidity();
			field.classList.toggle("is-valid", isValid);
			field.classList.toggle("is-invalid", !isValid);
		}

		fields.forEach(function (field) {
			field.addEventListener("input", function () {
				showState(field);
			});
		});

		form.addEventListener("submit", function (event) {
			event.preventDefault();
			fields.forEach(showState);
		});
	</script>
</body>
</html>
